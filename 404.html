<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>VaultVanguard — TrustBridge</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect logic
      // Converts 404 path into a query parameter redirect back to index.html
      var pathSegmentsToKeep = 1; // repository name segment: /VaultVanguard/
      var l = window.location;
      var repoPath = '/' + l.pathname.slice(1).split('/')[0];
      
      // If we are directly on username.github.io/repo/
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? '&' + l.search.slice(1) : '';
      var hash = l.hash || '';

      window.location.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoPath + '/?p=/' + encodeURIComponent(redirectPath) + query + hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to TrustBridge application...</p>
  </body>
</html>
